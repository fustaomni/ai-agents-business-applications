# contracts/mutations/d227.toml
# One branches:prune --yes removes a merged remote branch and its local tracking branch (D.227).

[[mutants]]
id = "trackers-not-proposed"
file = "scripts/branches_prune.py"
before = "        if branch.upstream in deleted\n"
after = "        if False\n"
killers = ["tests/test_branches_prune.py::test_a_merged_remote_and_its_local_branch_go_in_one_run"]

[[mutants]]
id = "trackers-ignore-upstream"
file = "scripts/branches_prune.py"
before = "        if branch.upstream in deleted\n"
after = "        if True\n"
killers = ["tests/test_branches_prune.py::test_a_merged_branch_never_pushed_is_deleted"]

[[mutants]]
id = "tracker-unmerged-proposed"
file = "scripts/branches_prune.py"
before = "        if branch.upstream in deleted\n        and branch.is_merged\n"
after = "        if branch.upstream in deleted\n"
killers = ["tests/test_branches_prune.py::test_a_merged_remote_and_its_local_branch_go_in_one_run"]

[[mutants]]
id = "tracker-held-proposed"
file = "scripts/branches_prune.py"
before = "        and branch.is_merged\n        and branch.held_by is None\n"
after = "        and branch.is_merged\n"
killers = ["tests/test_branches_prune.py::test_a_merged_remote_and_its_local_branch_go_in_one_run"]

[[mutants]]
id = "trackers-before-remotes"
file = "scripts/branches_prune.py"
before = "    return (*local, *remote, *tracking)"
after = "    return (*local, *tracking, *remote)"
killers = ["tests/test_branches_prune.py::test_a_merged_remote_and_its_local_branch_go_in_one_run"]
