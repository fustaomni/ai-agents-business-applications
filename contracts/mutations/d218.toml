# contracts/mutations/d218.toml
# Only the owning app's suite is re-requested, the policy judges ownership, a missing check
# with no declared app is refused, and the contract requires an app for every check (D.218).

[[mutants]]
id = "owners-ignored-when-acting"
file = "scripts/pr_checks.py"
before = "    awaiting = [suite for suite in request.suites if suite.check_runs == 0 and suite.app in owning]"
after = "    awaiting = [suite for suite in request.suites if suite.check_runs == 0]"
killers = ["tests/test_pr_checks.py::test_only_the_owning_apps_suite_is_rerequested"]

[[mutants]]
id = "policy-ignores-ownership"
file = "policies/runs/pr_checks/pr_checks.rego"
before = 'suite.app in _owning'
after = 'suite.app != ""'
killers = ["tests/test_pr_checks.py::test_another_apps_empty_suite_is_never_awaiting"]

[[mutants]]
id = "undeclared-owner-allowed"
file = "policies/runs/pr_checks/pr_checks.rego"
before = 'not name in {owner.check | some owner in input.pr_checks.owners}'
after = 'false'
killers = ["tests/test_pr_checks.py::test_a_missing_check_without_an_owner_is_refused"]

[[mutants]]
id = "contract-accepts-unowned-check"
file = "scripts/pr.py"
before = "        if set(self.owners) != set(self.checks):"
after = "        if False:"
killers = ["tests/test_pr_checks.py::test_an_expected_check_without_an_owner_is_invalid"]
