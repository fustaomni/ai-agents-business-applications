# contracts/task-effects.toml
# The tasks that only observe, verify or report (D.149). They take no lock and may run
# alongside anything. Every task NOT listed here is mutating: the gateway runs it only while
# it holds that task's lock in its worktree, and refuses a second concurrent run.

contract = "task-effects/v1"
read_only = [
  "audit:assertions",
  "audit:capabilities",
  "audit:evidence",
  "audit:exemptions",
  "audit:suppressions",
  "audit:problems",
  "audit:layers",
  "audit:models",
  "audit:schemas",
  "audit:workflows",
  "auth:describe",
  "check",
  "check:env-parity",
  "check:fixtures",
  "check:offline",
  "check:policy",
  "check:policy-decisions",
  "check:prereqs",
  "check:ruleset",
  "lint",
  "mutation:check",
  "nix:contract",
  "nix:flake-check",
  "nix:policy",
  "plan:step",
  "plan:trace",
  "plan:trailers",
  "pr-status",
  "pr:logs",
  "repo:history",
  "repo:state",
  "runs:verify",
  "source:outline",
  "source:read",
  "source:search",
  "source:structure",
  "source:units",
  "start:check",
  "status",
  "tasks:list",
  "test",
  "test:integration",
  "types",
  "worktree:conflicts",
  "worktree:list",
]
