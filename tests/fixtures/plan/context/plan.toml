# tests/fixtures/plan/context/plan.toml
# A committed plan for tests that need a realistic one (D.53): its own steps, comments,
# a because and decisions, so no test depends on any project's live plan.
contract = "project-plan/v1"

threads = [
  { id = "D", title = "Workflow" },
]

# The step plan:step reads, and the id a duplicate collides with.
[[steps]]
id = "D.12"
title = "A fixture step that a duplicate id collides with"
thread = "D"
done_when = [
  { kind = "task", name = "setup" },
]

[[steps]]
id = "D.22"
title = "A fixture step that probes depend on"
thread = "D"
depends_on = ["D.12"]
because = { "D.12" = "the probe reads the step before it" }
done_when = [
  { kind = "task", name = "plan:step" },
]

# The step whose evidence an amendment replaces.
[[steps]]
id = "D.32"
title = "A fixture step whose evidence an amendment replaces"
thread = "D"
done_when = [
  { kind = "task", name = "deps:add" },
]

[[decisions]]
id = "X.1"
title = "A fixture decision that plan:step reads"
state = "declined"
reason = "fixtures hold a decision so reading one is proven"

[[decisions]]
id = "X.3"
title = "A fixture decision that an amendment changes"
state = "superseded"
reason = "fixtures hold a decision so amending one is proven"
