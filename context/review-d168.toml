finding = "run_task, run_ledger and nix_ledger lock with fcntl.flock: kernel locks, released on death"

[[facts]]
id = "R19.1"
state = "settled"
finding = "quality gate required by name only, strict policy off, bypass_actors undeclared"

[[facts]]
id = "R21.3"
state = "settled"
finding = "spine.evaluate judges every declared code, fails undeclared fired codes, never passes unknown"

[[facts]]
id = "R26.1"
