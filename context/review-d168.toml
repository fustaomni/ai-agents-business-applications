[[records]]
id = "R1"
phase = 2
title = "the marker becomes a signed claim"
requirement = "replace the environment marker with a signed claim bound to commit, tree, gate definition, policy revision and run; local skip is efficiency only"

[[records]]
id = "R2"
phase = 2
title = "typed gate specification"
requirement = "GATES becomes GateSpec contracts with named fields, runs_in_hooks for ci_only, and a timeout per gate"

[[records]]
id = "R3"
phase = 2
title = "executed versus reused, as evidence"
requirement = "each gate records executed_passed, executed_failed, timed_out or reused, and a reuse carries its provenance"

[[records]]
id = "R4"
phase = 1
title = "a discriminated preflight result"
requirement = "the preflight returns one tagged union, never str or failure or None"

[[records]]
id = "R5"
phase = 1
title = "the environment proven before judgment"
requirement = "uv sync --locked --check before any gate, the interpreter is the project venv, gates run --no-sync"

[[records]]
id = "R6"
phase = 1
title = "a bounded runner for every child"
requirement = "new session, deadline, SIGTERM then grace then SIGKILL to the group, bounded reaping, typed timed_out"

[[records]]
id = "R7"
phase = 1
title = "push failures classified from porcelain"
requirement = "git push --porcelain, a discriminated push state, signals by name, and an ls-remote readback before any retry"

[[records]]
id = "R8"
phase = 2
title = "evidence, verdict, decision, enforcement on the spine"
requirement = "publish-evidence/v1, runs.publish rules, decision recorded before the push and the enforcement after"

[[records]]
id = "R9"
phase = 5
title = "boolean traps linted"
