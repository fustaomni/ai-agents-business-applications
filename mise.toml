# --- Authentication -----------------------------------------------------------

[tasks."auth:login"]
description = "Log in every Databricks profile identity declares, remove duplicates, verify all"
# WRITES THE DEFAULT PROFILE, NOT A NAMED ONE, AND THAT IS THE WHOLE POINT.
# The CLI resolves environment variables, then the DEFAULT profile, stopping at
# the first success -- so a laptop falls through to DEFAULT and CI stops at its
# own env vars. Identical code runs in both.
#
# A NAMED profile must be selected with -p, which needs a heuristic to decide
# when to pass it, which must be right in every environment. This repo shipped
# `--profile cscie103` first and spent four CI failures unwinding it.
#
# GOVERNED (D.97): the profiles come from identity, the CLI's list is read through a model, and
# runs.auth_login judges the plan. The shell that typed a host and parsed with python -c is gone.
run = "uv run --no-sync python scripts/auth_login.py"

[tasks."auth:federate-ci"]
description = "Create CI's Databricks federation policy from identity, refusing any foreign trust"
# D.98: CI exchanges GitHub's OIDC token for a Databricks token, so no client secret exists. Uses
# the ACCOUNT profile auth:login maintains, and creates only when no identical policy exists.
run = "uv run --no-sync python scripts/ci_federation.py"

[tasks."auth:describe"]
description = "Report which credentials the CLI resolved, and from where"
# The diagnostic that ended a four-attempt debugging loop: it reports the
# resolved auth type and the SOURCE of every field, which is what finally showed
# authentication was fine and bundle host resolution was not.
run = "databricks auth describe"

[tasks."auth:rotate-ci-secret"]
description = "Rotate the CI service principal's OAuth secret into GitHub"
# THE SECRET IS NEVER RENDERED. API -> stdin -> gh secret set, never through a
# variable, a file, or a terminal. An earlier secret here was generated with a
# bare `databricks api post`, printed, and had to be revoked -- it was in
# scrollback, shell history, and any session log. The remedy is not "remember to
# be careful"; it is that the only committed way to do this cannot print.
#
# 90-DAY LIFETIME: a credential with no expiry is one nobody rotates.
#
# The OLD secret is not revoked automatically -- revoking first would break every
# run between rotation and the next successful deploy.
run = '''
set -euo pipefail
sp_id="$(databricks api get /api/2.0/account/scim/v2/ServicePrincipals \
  | uv run --no-sync python -c "
import sys, json
for r in json.load(sys.stdin).get('Resources', []):
    if r.get('displayName') == 'aiba-ci':
        print(r['id'])
")"

if [ -z "$sp_id" ]; then
  echo "aiba-ci not found; run 'mise run bootstrap:identity' first" >&2
  exit 1
fi

databricks api post \
  "/api/2.0/accounts/servicePrincipals/$sp_id/credentials/secrets" \
  --json '{"lifetime":"7776000s"}' \
  | uv run --no-sync python -c "import sys, json; print(json.load(sys.stdin)['secret'], end='')" \
  | gh secret set DATABRICKS_CLIENT_SECRET

echo "rotated. active secrets:"
databricks api get "/api/2.0/accounts/servicePrincipals/$sp_id/credentials/secrets" \
  | uv run --no-sync python -c "
import sys, json
d = json.load(sys.stdin)
for s in d.get('secrets', d.get('Resources', [])):
    print(f\"  {s['id'][:12]}... {s['status']} expires {s['expire_time']}\")
"
echo
echo "verify CI passes, THEN revoke the old secret id above with:"
echo "  databricks api delete /api/2.0/accounts/servicePrincipals/$sp_id/credentials/secrets/<old-id>"
'''

# --- Repository configuration -------------------------------------------------

[tasks."repo:configure"]
description = "Apply repository settings and branch ruleset (idempotent)"
# REPOSITORY SETTINGS ARE INFRASTRUCTURE. Clicked in a web UI they are invisible
# to the repo, unreviewable and unreproducible. Found the hard way: `mise run
# pr` failed with "Auto merge is not allowed for this repository" AFTER pushing
# and creating the PR.
#
# TWO HALVES, AND THE SECOND MAKES THE FIRST MEAN ANYTHING:
#   settings  allow auto-merge, merge commits only, delete branch on merge
#   ruleset   protect develop and main, and REQUIRE the quality gate
#
# Without a REQUIRED status check, auto-merge has nothing to wait for and fires
# immediately -- worse than no auto-merge, because it looks like a gate.
#
# MERGE COMMITS ONLY: GitFlow depends on merge topology, and squashing would
# collapse commits whose reasoning is the most valuable thing here.
#
# required_approving_review_count IS 0 because this is a solo repository.
# Requiring a review nobody can give would block every merge; the gate is CI.
run = '''
set -euo pipefail

gh api -X PATCH "repos/{owner}/{repo}" \
  -F allow_auto_merge=true \
  -F allow_merge_commit=true \
  -F allow_squash_merge=false \
  -F allow_rebase_merge=false \
  -F delete_branch_on_merge=true \
  > /dev/null
echo "settings applied"

name="develop-and-main-protection"
existing="$(gh api "repos/{owner}/{repo}/rulesets" --jq \
  ".[] | select(.name == \"$name\") | .id" || true)"

if [ -n "$existing" ]; then
  gh api -X PUT "repos/{owner}/{repo}/rulesets/$existing" \
    --input contracts/ruleset-develop-and-main.json > /dev/null
  echo "ruleset updated (id $existing)"
else
  gh api -X POST "repos/{owner}/{repo}/rulesets" \
    --input contracts/ruleset-develop-and-main.json > /dev/null
  echo "ruleset created"
fi

echo "--- readback ---"
gh api "repos/{owner}/{repo}" \
  --jq '{auto_merge:.allow_auto_merge, merge_commit:.allow_merge_commit, squash:.allow_squash_merge, rebase:.allow_rebase_merge, delete_on_merge:.delete_branch_on_merge}'
gh api "repos/{owner}/{repo}/rulesets" \
  --jq '.[] | {id, name, enforcement}'
'''

