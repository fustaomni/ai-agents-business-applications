# --- Worktrees ----------------------------------------------------------------
# Linked worktrees let one task proceed while another is mid-review, without
# stashing or a second clone.
#
# ARGUMENTS COME FROM THE usage SPEC, NOT A TERA TEMPLATE. {{arg(name='slug')}}
# works today and mise removes it in a future release. Tera's failure shapes are
# the ones this repo keeps finding: template functions return EMPTY STRINGS
# during spec collection, and behaviour differs between TOML and file tasks.
#
# THE ? IN ${usage_slug?} IS THE POINT: bash parameter expansion that FAILS when
# the variable is unset rather than expanding to empty -- without it a missing
# argument becomes `worktree.py refresh ""`, a command that runs and does
# something nobody asked for.

[tasks."worktree:add"]
description = "Create a sibling worktree on a new feature branch, with setup run"
# Creates <repo>-<slug> beside the main clone, then runs `mise run setup` inside
# it. Without that a fresh worktree has no .venv and no hooks, so the gate
# cannot run and a commit is refused.
usage = '''
arg "<slug>" help="Short kebab-case description, e.g. workstation-as-code"
'''
run = 'uv run --no-sync python scripts/worktree.py add "${usage_slug?}"'

