# mise.toml
# TASKS. The toolchain lives in flake.nix; this file does not own tools.
#
# WHERE THE PYTHON VERSION LIVES, AND WHY NOT HERE:
#   The authoritative declaration is `environment_version` in the bundle
#   (databricks.yml / resources/*.yml). That value is what deploys and what the
#   server runs. Restating the interpreter here would create a second
#   hand-maintained copy of one fact, and two copies drift. Drift surfaces as
#   "Python versions in the Spark Connect client and server are different",
#   discovered when a UDF dies rather than when the change was made.
#
#   So: .python-version holds the local interpreter, the bundle holds the target,
#   contracts/environment-versions.json maps between them, and
#   `mise run check:env-parity` fails the build when they disagree.
#   A gate, not a comment.
#
# KNOWN SEAM: that mapping file is transcribed from published docs, because
# Databricks exposes environment version contents as a reference table, not an
# API. It is the one link a human maintains. Named here rather than hidden.
#   https://docs.databricks.com/aws/en/release-notes/serverless/environment-version/

# --- WHY THERE IS NO [tools] BLOCK --------------------------------------------
#
# This file pinned nine tools and flake.nix declared the same nine: two
# declarations of one fact, which is the drift this repository exists to remove,
# reproduced at its centre. scripts/check_toolchain_parity.py bridged that gap
# and is retired with the block.
#
# WHAT NIXPKGS SHIPS IS REPORTED, NOT RESTATED HERE. At the switch, every tool
# nixpkgs shipped matched or was newer than what this block had pinned. The
# versions now are whatever flake.lock lands, and `mise run run nix:lock-update`
# reports them as data each time it refreshes the lock (D.86). A version written
# here would be a second copy of that fact, false by the next refresh.
#
# THAT MATCH ONLY EXISTS ON nixpkgs-unstable. The flake was first pinned to
# nixos-26.05, a frozen release branch whose packages were four months stale by
# design -- uv 0.11.21, regal 0.40, databricks 0.290.2, a superseded major line
# of the CLI. The branch was the problem, not Nix. flake.lock provides the
# reproducibility a release branch was chosen for.
#
# THERE IS ALSO NO [settings] BLOCK ANY MORE. It carried `lockfile = true` and
# `install_before = "7d"`, both of which govern mise's TOOL INSTALLATION. With
# no tools to install they enforce nothing, and a setting that enforces nothing
# is a claim of coverage this repository does not make. flake.lock is now the
# lockfile, and mise.lock is deleted rather than left as an artifact describing
# a toolchain that no longer comes from here.

# NO [env] BLOCK SETTING DATABRICKS_HOST, AND THAT ABSENCE IS DELIBERATE.
#
# It was set here briefly and broke local authentication. The CLI resolves
# credentials in order -- environment variables, then the .databrickscfg DEFAULT
# profile -- and stops at the first success. A bare DATABRICKS_HOST looks like
# progress: it names a workspace without supplying any way to prove identity, so
# resolution halts and never reaches the profile that holds the OAuth session.
# The result is "cannot configure default credentials ... Env: DATABRICKS_HOST".
#
# So the host comes from the DEFAULT profile locally and from ci.yml on the
# runner, where it accompanies real credentials. Same rule as everywhere else in
# this repo: the environment supplies a COMPLETE answer or none at all.

# --- Task interpreter ---------------------------------------------------------
[task_config]
# EVERY TASK RUNS INSIDE THE NIX DEVSHELL. This line is what makes the toolchain
# cutover work, and without it nothing here runs at all.
#
# Removing [tools] left `uv`, `opa` and the rest unresolvable: `mise run lint`
# died with "No version is set for shim: uv". The tools existed -- in the flake
# -- but nothing put them on PATH for a task body.
#
# THE ALTERNATIVE WAS `nix develop --command` AT EVERY CALL SITE: forty task
# bodies, four lefthook jobs and a CI workflow, each depending on someone
# remembering. One forgotten call site is a task that works for whoever happens
# to be inside a shell already and fails for everyone else -- the ambient-state
# dependency this repository exists to remove. One boundary, declared once.
#
# THE SHELL IS STILL PINNED, which was this setting's original purpose. mise
# defaults to `sh`, and `sh` is bash-in-POSIX-mode on macOS and dash on the
# Ubuntu runner: same task body, different interpreter, green locally and dead
# in CI. `bash -c` inside `nix develop` keeps that pin and adds the toolchain.
#
# BASH DOES NOT SET errexit, WHICH IS WHY EVERY MULTI-COMMAND TASK BELOW OPENS
# WITH `set -euo pipefail`. mise's own default includes `-o errexit -o
# pipefail`; overriding the shell discards that. A multi-command task without it
# reports the exit code of its LAST command, so an earlier failure passes
# silently -- `nix:policy` shipped exactly that bug, running four checks where
# only the fourth could fail the task.
shell = "nix develop --command bash -c"

# --- Nix ----------------------------------------------------------------------

[tasks."nix:contract"]
description = "Verify this machine's Nix installation against the contract"
run = "uv run --no-sync python scripts/nix_contract.py"

[tasks."nix:bootstrap"]
description = "Install Nix, idempotently, with the Determinate installer"
# THE ONLY TASK THAT CANNOT RUN IN THE DEVSHELL, because it is what makes the
# devshell possible. `shell` above would need nix to already exist.
#
# NOT A CHICKEN-AND-EGG PROBLEM IN PRACTICE: a machine without nix cannot run
# any task here, and this one prints what to do rather than pretending. Run it
# directly if mise cannot start:
#   bash scripts/... is not needed; the body below is the whole procedure.
run = '''
set -euo pipefail
if command -v nix > /dev/null 2>&1; then
  echo "nix is already installed: $(nix --version)"
  exit 0
fi

echo "Installing Determinate Nix. This creates an APFS volume at /nix, a"
echo "launchd daemon, build users, and edits /etc/zshrc and /etc/fstab."
echo "It writes /nix/receipt.json so it can be cleanly uninstalled."
curl -fsSL https://install.determinate.systems/nix | sh -s -- install
'''

[tasks."nix:shell"]
description = "Enter the Nix devShell interactively"
# THE TOOLCHAIN, FOR A HUMAN. Tasks enter this shell automatically via
# task_config; this is for working in it directly -- running a tool ad hoc,
# checking a version, debugging a build.
run = "nix develop"

[tasks."nix:flake-check"]
description = "Evaluate the flake on every supported platform"
# --all-systems IS THE POINT. Without it only the current platform is checked,
# and a package present on Darwin but not Linux passes locally and breaks on the
# runner -- the machine-dependence this project keeps removing.
#
# --no-build evaluates derivations without realising them: seconds rather than a
# toolchain download. IT PROVES NAMES RESOLVE, NOT THAT THEY BUILD. An unfree
# licence on databricks-cli passed four green platforms here and failed on the
# first real `nix develop`, because licences are checked at realisation.
run = "nix flake check --no-build --all-systems"

[tasks."nix:lock-update"]
description = "Refresh nixpkgs in flake.lock, kept only if CI's flake checker would accept it"
# THE REMEDY ci.yml's flake checker never had (D.86). It fails every PR once nixpkgs is 30
# days old, deliberately; this is the declared answer. The old lock is restored on refusal.
run = "uv run --no-sync python scripts/nix_lock_update.py"

[tasks."nix:policy"]
description = "Format, check, lint and unit-test the machine policy"
# `set -euo pipefail` ADDED, AND ITS ABSENCE WAS A REAL FAIL-OPEN BUG.
#
# This ran four commands under `bash -c`, which does not set errexit. A failing
# `opa fmt` or `opa check` did not stop the task, and the exit code came from
# `opa test` alone -- so three of four checks could fail while the task reported
# success. The same shape as a gate whose result is never printed.
run = '''
set -euo pipefail
opa fmt --fail --diff policies/machine/nix
opa check --strict policies/machine/nix
regal lint policies/machine/nix
opa test policies/machine/nix --fail-on-empty
'''

# --- Prerequisites ------------------------------------------------------------
# Things the bundle DEPENDS ON but cannot own. The industry split is settled:
# Terraform owns platform infrastructure and identity, bundles own the deployable
# workload. Groups are identity, so they belong in the Terraform layer -- and
# would live there on a paid tier. Free Edition blocks the account host Terraform
# needs, which puts this in the third layer of the standard pattern: imperative
# automation for gaps declarative configuration cannot reach.

[tasks."bootstrap:identity"]
description = "Create the account groups and service principals the project depends on (idempotent)"
run = "uv run --no-sync python scripts/bootstrap_identity.py"

# --- Gates --------------------------------------------------------------------
#
# EVERY TASK RUNS PYTHON THROUGH uv, NEVER BARE python3.
#
# Fourteen tasks invoked `python3 scripts/...`, and every one ran on Homebrew's
# Python 3.14.7 -- outside the project venv, two minor versions off the pinned
# 3.12.3, with none of the locked dependencies importable. They worked only
# because they happened to use nothing but the standard library.
#
# A bare interpreter name is PATH resolution, and PATH is ambient state this
# repo does not control. policies/runtime/ denies it now rather than trusting
# that nobody reintroduces it.

[tasks.fmt]
description = "Apply every safe autofix: formatting AND import ordering"
# TWO OPERATIONS, NOT ONE. `ruff format` handles layout; import ORDERING is the
# I lint rule, fixed by `ruff check --fix`. Treating fmt as though it covered
# both meant every import change became a hand edit lint caught afterwards.
#
# `;` NOT `&&`, AND NOT `set -e`. ruff check --fix exits non-zero when a finding
# has no safe autofix, which with && stopped the formatter running -- and the
# formatter is often what resolves the remaining finding, since line-length is
# fixed by rewrapping. The `lint` gate still reports both, so continuing hides
# nothing.
run = "uv run --no-sync ruff check --no-cache --fix . ; uv run --no-sync ruff format ."

[tasks.lint]
description = "Lint (the same invocation CI uses)"
# WITHOUT --fix, DELIBERATELY. A CI job that fixes its own input can pass while
# the committed code stays wrong.
run = "uv run --no-sync ruff check --no-cache ."

[tasks.types]
description = "Static type check, for every platform this code runs on"
# BOTH PLATFORMS, DELIBERATELY. mypy defaults to whichever OS it runs on and
# NARROWS sys.platform comparisons, so a Darwin-only branch is invisible to a
# Linux run and vice versa. This repo is a macOS laptop plus a Linux runner;
# either gap is a branch nobody checks.
#
# mypy has no native multi-platform mode (python/mypy#12286); invoking it once
# per target is the documented approach and far cheaper than a CI OS matrix.
run = '''
set -euo pipefail
uv run --no-sync mypy --platform darwin
uv run --no-sync mypy --platform linux
'''

[tasks.test]
description = "Hermetic tests: no network, no credentials"
# addopts in pyproject.toml deselects the integration marker, so this is safe in
# check:offline behind the pre-push hook.
run = "uv run --no-sync pytest"

[tasks."test:integration"]
description = "Tests requiring network and Databricks credentials"
# WITHOUT THIS TASK THE INTEGRATION TESTS RUN NOWHERE. They are deselected from
# the default run by design, so writing one and stopping there produces a test
# that exists and never executes -- worse than no test, because it looks like
# coverage.
run = "uv run --no-sync pytest -m integration"

[tasks.check]
description = "The quality gate. CI runs exactly this task; nothing is restated in ci.yml"
# SINGLE SOURCE OF TRUTH. A second copy of the gate list in ci.yml would drift
# the moment a check is added here and forgotten there.
#
# NOT depends = [...]. mise runs dependencies in PARALLEL with no order and
# reports failure as soon as one fails. Observed: `test` failed at 1.4s and
# `types` never reported at all, because mypy was still running and nobody was
# listening. A gate whose result is never printed is indistinguishable from one
# that passed.
#
# scripts/check_all.py runs every gate to completion and reports all failures in
# one pass. Serial and slower, deliberately: on a gate that runs every commit,
# telling the whole truth beats a few seconds.
run = "uv run --no-sync python scripts/check_all.py"

[tasks."check:offline"]
description = "The gate minus anything needing network or Databricks auth (git hooks)"
# SAME LIST, FILTERED -- not a second list. scripts/check_all.py marks each gate
# with whether it needs the network; --offline selects the rest.
#
# WHY HOOKS DO NOT RUN THE FULL GATE: prereqs and env-parity need a live
# workspace and valid auth. A pre-commit that fails on a plane is one people
# bypass with --no-verify, and a bypassed hook catches nothing. CI runs the full
# gate; that is the layer where a bypass is caught.
run = "uv run --no-sync python scripts/check_all.py --offline"

[tasks."check:prereqs"]
description = "Verify the unmanaged dependencies the bundle relies on"
# Without this, a missing prerequisite surfaces as a bundle deploy failure with
# an API error naming the symptom rather than the cause. This fails first and
# prints the command that fixes it.
run = "uv run --no-sync python scripts/check_prereqs.py"

[tasks."check:env-parity"]
description = "Fail if the local interpreter drifts from the deployed environment version"
# NOT a comment saying "keep these in sync". The interpreter version necessarily
# lives in two places -- .python-version drives the local toolchain,
# environment_version drives the server -- and two copies of one fact drift.
run = "uv run --no-sync python scripts/check_env_parity.py"

[tasks."check:policy"]
description = "Format, check, lint and unit-test every Rego policy"
# --fail-on-empty is not optional: `opa test` SUCCEEDS when zero tests run, so a
# renamed package or mistyped path would report green while testing nothing --
# the silent-pass failure this repo removes everywhere else.
run = '''
set -euo pipefail
opa fmt --fail --diff policies/
opa check --strict policies/
regal lint policies/
opa test policies/ --fail-on-empty
'''

[tasks."check:policy-decisions"]
description = "Evaluate this repo's own tasks against the policies"
# THE SPLIT THAT IS KEPT, BECAUSE IT IS A DIFFERENCE IN KIND:
#   check:policy            are the policies well-formed and tested?
#   check:policy-decisions  does the CODEBASE satisfy them?
#
# A policy suite can be immaculate and enforce nothing. Only evaluating real
# input proves the repo obeys its own rules.
run = "uv run --no-sync python scripts/evaluate_policies.py"

[tasks."deps:install"]
description = "Install exactly what uv.lock pins, refusing a lock that no longer resolves"
# --locked, NOT --frozen: --frozen installs a stale lock without complaint and
# lets a later `uv run` fail for it under another step's name. --locked never
# rewrites uv.lock, so starting this task cannot dirty the lockfile (D.9).
run = "uv sync --locked"

[tasks."check:ruleset"]
description = "Judge the server's ruleset: the gate required, pinned to its app, strict, unbypassable"
# Checks the ruleset's CONTENTS, not its existence: one edited to require
# nothing is the failure mode that looks like success.
#
# NOT a dependency of `check` -- that runs on every commit and this needs
# network plus gh auth, and a local commit cannot weaken a server-side ruleset.
# Not a scheduled workflow either: GitHub disables those after 60 days of
# repository inactivity, and a check that silently stops is worse than none.
run = "uv run --no-sync python scripts/check_ruleset.py"

[tasks."check:fixtures"]
description = "Fail if the committed fixture no longer matches the bundle"
# A STALE FIXTURE FAILS CONFUSINGLY WITHOUT THIS. Adding a grants block left the
# fixture describing the old shape and the test reported "volumes.X has no
# grants key" -- which reads as a bundle defect and is actually a capture nobody
# refreshed.
run = "uv run --no-sync python scripts/update_fixtures.py --check"

# --- Onboarding ---------------------------------------------------------------

[tasks.setup]
description = "One-command onboarding: dependencies and git hooks"
# `lefthook install` writes into .git/hooks, which is NOT version controlled. A
# fresh clone has no hooks at all, so the person who most needs the guardrails
# is the one running without them.
#
# NO `mise install` ANY MORE. It installed the [tools] block, which is gone;
# leaving it would be a step that appears to provision a toolchain and does
# nothing. `nix develop` provisions it, and task_config enters that shell.
#
# NEVER ADD -f TO lefthook install. Without it, lefthook declines when
# core.hooksPath points elsewhere. With it, lefthook force-installs into
# whatever that path resolves to -- and when that is a GLOBAL hooks directory,
# this repo's hooks start running in every repository on the machine. A real
# 2026 incident; the fix was deleting the flag.
#
# THE QUOTING IS LOAD-BEARING. TOML basic strings treat backslash as an escape
# opener, so a shell body containing `\.sample` fails to parse -- this task was
# written that way first and broke the whole config. Literal strings (three
# single quotes) do no escape processing.
run = '''
set -euo pipefail

hooks_path="$(git config --get core.hooksPath || true)"
if [ -n "$hooks_path" ]; then
  echo "refusing: core.hooksPath is set to '$hooks_path'." >&2
  echo "lefthook would decline rather than clobber it, which is correct --" >&2
  echo "but you would be left with no hooks and no explanation." >&2
  echo "" >&2
  echo "inspect first:" >&2
  echo "  git config --show-origin --get-all core.hooksPath" >&2
  echo "then clear it deliberately:" >&2
  echo "  git config --unset core.hooksPath          # local" >&2
  echo "  git config --global --unset core.hooksPath # global" >&2
  exit 1
fi

uv sync --locked
lefthook install

echo
echo "setup complete. hooks active:"
# RESOLVE THE HOOKS PATH; NEVER ASSUME .git/hooks. In a linked worktree .git is
# a FILE pointing at .git/worktrees/<name>, so `ls .git/hooks` fails with "Not a
# directory" -- and that cosmetic listing once took the exit code with it after
# every real step had succeeded.
hooks_dir="$(git rev-parse --git-path hooks)"
if [ -d "$hooks_dir" ]; then
  ls "$hooks_dir" | grep -v sample | sed 's|^|  |'
else
  echo "  (none found at $hooks_dir)"
fi
'''

# --- Workflow -----------------------------------------------------------------
# EVERY PROJECT OPERATION IS A TASK. Not a remembered command, not a paste from
# scrollback. A one-off CLI invocation is behavior that exists only in one
# person's history: untested, undiscoverable, impossible to change deliberately.
#
# NOTE: there is no `start` task. It ran `git switch -c` inside a mise task,
# which runs in a SUBSHELL -- so the switch died with that subshell and the
# caller stayed on develop, while the task printed "on feature/x" and reported
# success. `start:here` PRINTS the command for the caller to eval instead, and
# `start:check` fails loudly when work happens on a protected branch anyway.
#
# NOTE: there is no pr-wait task. `gh pr checks --watch` exits immediately when
# no check has registered yet, so it reported "no checks reported" and returned
# a verdict it had not determined. `pr` waits properly, in three bounded phases.

[tasks.commit]
description = "Commit exactly the named paths with a conventional message, through the hooks"
# COMMITTING WAS NEVER A TASK, and it is the operation performed most often here.
# Every commit was `git commit --file /tmp/msg.txt --no-verify`, which skipped
# start:check, fmt and lint on every single one -- the gate was reached only at
# push time.
#
# NAMED PATHS, NEVER -A: a stray zero-byte file was swept into a commit that way.
# The outcome is a command-outcome/v1 envelope on stdout and 0, 1 or 2 as the
# exit code, so a caller branches on a refusal without parsing a word.
#
#   mise run commit -- --message "feat(x): subject" --path scripts/x.py
run = "uv run --no-sync python scripts/commit.py"

[tasks.pr]
description = "Open a PR and block until it is merged"
# BLOCKS, HAVING ORIGINALLY NOT. The first version enabled auto-merge and
# returned with state BLOCKED, moving the cost to the person -- who watched the
# Actions tab and confirmed the merge by hand on twelve pull requests.
#
# Three phases, because waiting for checks to APPEAR and waiting for them to
# FINISH are different problems. Each is bounded: an unbounded wait hangs when
# something upstream never resolves, teaching the person nothing.
run = "uv run --no-sync python scripts/pr.py"

[tasks."pr-status"]
description = "Show merge state and checks for the current branch's PR"
run = "gh pr view --json number,title,mergeable,mergeStateStatus,autoMergeRequest,statusCheckRollup --jq '{pr:.number,title,mergeable,state:.mergeStateStatus,auto:(.autoMergeRequest != null),checks:[.statusCheckRollup[]|{name,conclusion}]}'"

[tasks.sync]
description = "Return to develop, pull, and remove branches that are safe to remove"
# STATE-DRIVEN, NOT A PIPELINE. This piped `git for-each-ref` through awk and
# deleted whatever reported [gone]. It worked until a worktree held one of those
# branches: git refused -- correctly -- and the task ABORTED after the pull had
# succeeded, leaving the sync half done.
#
# Cleanup had no model of what it was cleaning. scripts/repo_state.py answers
# protection, merge status and worktree ownership at once, and reports what it
# did NOT remove and why.
run = "uv run --no-sync python scripts/sync.py"

[tasks.status]
description = "Show branch, working tree, and how it relates to develop"
# READ OPERATIONS ARE PROJECT OPERATIONS TOO. `git status` typed by hand is
# still a throw-away CLI: the next person guesses which flags matter.
run = '''
set -euo pipefail
echo "branch:   $(git rev-parse --abbrev-ref HEAD)"
echo "upstream: $(git rev-parse --abbrev-ref --symbolic-full-name '@{u}' 2>/dev/null || echo '(none)')"
echo
echo "--- working tree ---"
if [ -z "$(git status --porcelain)" ]; then
  echo "clean"
else
  git status --short
fi
echo
echo "--- unmerged into develop ---"
git log --oneline develop..HEAD 2>/dev/null || echo "(on develop)"
echo
echo "--- local branches ---"
git branch -vv
'''

[tasks."start:check"]
description = "Refuse to work on a protected branch"
# Wired into the pre-commit hook so the guard fires before a commit lands rather
# than after. Fails closed, which is what an unattended run needs: it will not
# notice a warning, but it will notice a non-zero exit.
run = '''
set -euo pipefail
branch="$(git rev-parse --abbrev-ref HEAD)"
case "$branch" in
  develop|main)
    echo "refusing: on protected branch '$branch'." >&2
    echo "" >&2
    echo "GitFlow: work happens on a feature branch cut from origin/develop." >&2
    echo "" >&2
    echo "nothing is lost -- carry the work across with:" >&2
    echo "  git switch -c feature/<slug>" >&2
    echo "or start cleanly with:" >&2
    echo "  eval \"\$(mise run start:here <slug>)\"" >&2
    exit 1 ;;
esac
echo "on $branch (not protected)"
'''

[tasks."start:here"]
description = "Cut a feature branch from origin/develop in THIS shell"
# PRINTS the command instead of pretending to run it, because a mise task runs
# in a subshell and cannot change the invoking shell's branch:
#
#   eval "$(mise run start:here <slug>)"
#
# Uncommitted work carries across automatically: `git switch -c` keeps the
# working tree, so a modified file on develop lands on the new branch.
usage = '''
arg "<slug>" help="Short kebab-case description, e.g. assignment-01-spark-api"
'''
run = '''
set -euo pipefail
slug="$usage_slug"

case "$slug" in
  *[!a-z0-9-]*|"")
    echo "echo 'slug must be lowercase kebab-case: $slug' >&2; false" ;;
  *)
    echo "git fetch origin --prune --quiet && git switch -c feature/$slug origin/develop" ;;
esac
'''

# --- Planning -----------------------------------------------------------------

[tasks."plan:trace"]
description = "Check the plan, its trace and its id ledger agree, and report it as data"
# A MATRIX NOBODY VERIFIES IS AN ARCHIVE: it looks complete because nothing
# contradicts it. This names an item no source authorises, a claim about an
# item the plan dropped, an id never issued and a retired id back in use. The
# same checks run in the test gate; this is the question asked directly.
run = "uv run --no-sync python scripts/plan_files.py"

[tasks."plan:status"]
description = "Decide each step's state from the evidence on origin/develop, and record it"
# THE DECISION IS POLICY. This observes what holds on the integration branch,
# policies/plan decides each step's state, and the decision is recorded under
# .artifacts/plan-status/ so progress is compared from data, not from memory.
run = "uv run --no-sync python scripts/plan_status.py"

[tasks."plan:trailers"]
description = "Refuse a commit that names no plan step, or one never issued or retired"
# TWO POINTS, ONE POLICY. With a message file it is the commit-msg hook; with
# none it judges every commit on this branch since origin/develop, as the gate does.
usage = '''
arg "[message]" help="A commit message file; the branch since origin/develop when omitted"
'''
run = 'uv run --no-sync python scripts/plan_trailers.py ${usage_message:-}'

[tasks."plan:matrix"]
description = "Derive the requirement matrix, record it, and refuse what fails to trace"
# DERIVED, NEVER WRITTEN BY HAND. Every change on develop must trace to a step,
# and every done step to the change that did it; policies/plan decides.
run = "uv run --no-sync python scripts/plan_matrix.py"

[tasks."repo:state"]
description = "Observe every worktree and long-lived branch as typed evidence, and record the run"
# EVIDENCE AS DATA: repository-state/v1, verdicts as booleans, never console prose.
run = "uv run --no-sync python scripts/repo_report.py"

[tasks."runs:verify"]
description = "Verify the run ledger's hash chain is intact, and record the run"
# A BROKEN CHAIN IS REFUSED AND NOT APPENDED TO, so the break stays visible.
run = "uv run --no-sync python scripts/run_ledger.py"

[tasks."pr:logs"]
description = "Read the current branch's latest failed CI run as typed data, and record the run"
# EVIDENCE AS DATA: ci-failure/v2, the failed steps and their lines, and every step
# or job that ended other than in success (a cancelled step; a job no runner took).
run = "uv run --no-sync python scripts/pr_logs.py"

[tasks."ci:rerun"]
description = "Re-run this branch's failed CI run once, only while Actions is steadily healthy"
# A DECISION, NOT A RETRY LOOP: refused unless GitHub's Actions component reads
# operational three times in a row and the run is this branch's head (D.83).
run = "uv run --no-sync python scripts/ci_rerun.py"

[tasks."pr:checks"]
description = "Re-request an app's check suite on this PR's head when a declared check never ran"
# THE CHECK THAT NEVER REGISTERED (D.217): GitGuardian posted nothing on PR #157. Decided by
# runs.pr_checks, only suites awaiting a run, and done only when the check is seen on the head.
run = "uv run --no-sync python scripts/pr_checks.py"

[tasks."bundle:deploy"]
description = "Validate the bundle strictly, then deploy it to a target (dev unless named)"
# VALIDATE --strict BEFORE EVERY DEPLOY. 2026 practice makes validate the reflex
# before deploy, and --strict because a plain validate reports an unknown
# property only as a warning -- and a job once deployed without its task.
# prod needs no extra guard here: production mode refuses any branch but main.
usage = '''
